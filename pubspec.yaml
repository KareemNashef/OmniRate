name: omnirate
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  animations: ^2.0.7
  provider: ^6.0.5
  sqflite: ^2.0.0+4
  path_provider: ^2.0.8
  flutter_svg: ^2.1.0
  flutter_signin_button: ^2.0.0
  firebase_auth: ^5.5.4
  cloud_firestore: ^5.6.8
  shared_preferences: ^2.5.3
  firebase_core: ^3.13.1
  dynamic_color: ^1.7.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.4.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  restart_app: ^1.3.2
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.6

flutter_icons:
  android: true
  image_path: "assets/settings/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/settings/
    - assets/Debug/Games/
    - assets/Debug/Movies/
    - assets/Debug/Shows/
