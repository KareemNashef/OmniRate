name: omnirate
description: "A new Flutter project."
publish_to: 'none'
version: 2.0.1+8

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cached_network_image: ^3.4.1
  cloud_firestore: ^5.6.11
  firebase_auth: ^5.6.2
  firebase_core: ^3.15.1
  flutter_dotenv: ^5.2.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  http: ^1.4.0
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.6

flutter_icons:
  android: true
  image_path: "assets/settings/icon.png"

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/settings/
    - assets/ProfilePics/
    - assets/Debug/Games/
    - assets/Debug/Movies/
    - assets/Debug/Shows/
